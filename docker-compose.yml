services:
  database:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: docusense_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d docusense_ai']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: build
    command: npm run prisma:migrate:deploy --workspace backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@database:5432/docusense_ai
    depends_on:
      database:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      CORS_ORIGIN: http://localhost:8080
      TRUST_PROXY: 'false'
      DATABASE_URL: postgresql://postgres:postgres@database:5432/docusense_ai
      UPLOAD_DIR: /app/uploads
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_EMBEDDING_MODEL: gemini-embedding-001
      GEMINI_EMBEDDING_DIMENSIONS: 1536
      GEMINI_GENERATION_MODEL: ${GEMINI_GENERATION_MODEL:-gemini-3.8-flash}
      OCR_LANG_PATH: /app/backend
    volumes:
      - uploads-data:/app/uploads
    ports:
      - '4000:4000'
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:4000/api
    ports:
      - '8080:80'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  uploads-data:
